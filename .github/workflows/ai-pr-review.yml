name: AI PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          pip install code-review-graph

      - run: |
          code-review-graph build

      - run: |
          code-review-graph detect-changes

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: AI Review
        run: |
          claude \
            --print \
            "Review this pull request using the code-review-graph MCP tools. Focus on architecture, bugs, security, maintainability, performance, and impacted services."

